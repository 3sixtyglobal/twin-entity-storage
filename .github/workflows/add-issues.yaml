name: Add issues to project

# GHA_RELEASE_TOKEN requires
# org->project: read/write
# repos->issues: read

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on:
        labels: ${{ github.event.repository.private && 'self-hosted-small' || 'ubuntu-latest' }}
        group:  ${{ github.event.repository.private && 'small' || 'default' }}

    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/twinfoundation/projects/3
          github-token: ${{ secrets.GHA_RELEASE_TOKEN }}
