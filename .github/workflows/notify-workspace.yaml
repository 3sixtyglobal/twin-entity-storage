# Notify the workspace repository when a PR targeting the next branch is merged. This allows the workspace to update its submodule references accordingly.
name: Notify Workspace

on:
  # Manually trigger this workflow from the GitHub UI to notify the workspace about a merged PR in the next branch.
  workflow_dispatch:
  # Trigger when commits are pushed to next.
  push:
    branches: [next]
  # Trigger when a PR targeting next is closed.
  pull_request:
    types: [closed]
    branches: [next]

jobs:
  notify-workspace:
    # Continue for pushes, and for closed PRs only if they were merged.
    if: ${{ github.event_name == 'push' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch submodule change to workspace
        # Personal access token stored in each submodule repo secrets.
        # Must have permission to dispatch events to twinfoundation/workspace.
        env:
          GH_TOKEN: ${{ secrets.GHA_RELEASE_TOKEN }}
        run: |
          # Send a repository_dispatch event to the workspace repo.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
            SHA="${{ github.event.pull_request.merge_commit_sha }}"
            PR_NUMBER='${{ github.event.pull_request.number }}'
          else
            BRANCH="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
            PR_NUMBER='null'
          fi

          gh api repos/twinfoundation/workspace/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "submodule-changed",
            "client_payload": {
              "submodule": "${{ github.event.repository.name }}",
              "branch": "${BRANCH}",
              "sha": "${SHA}",
              "pr": ${PR_NUMBER}
            }
          }
          EOF
