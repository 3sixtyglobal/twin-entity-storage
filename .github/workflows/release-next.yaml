name: Release Next

# GHA_RELEASE_TOKEN requires:
#   contents: read/write
#   pull-requests: read/write
#   workflows: read/write

# Orchestrates the full prerelease lifecycle in a single run.
#
# Phase 1 – Prepare:
#   Refreshes docs, runs release-please to create a versioned PR. Stops here.
#
# Gate  1 – Wait for release PR:
#   Polls until the release PR (autorelease: pending) is approved and merged.
#
# Phase 2 – Publish:
#   Publishes packages to npm (next tag) and creates GitHub releases.

on:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 1 – PREPARE
  # ──────────────────────────────────────────────────────────────────────────
  prepare:
    name: 'Phase 1 · Prepare release PR'
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      checks: read
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.release-prepare.outputs.pr_number }}
      pr_url: ${{ steps.release-prepare.outputs.pr_url }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Prepare release PR
        id: release-prepare
        uses: ./.github/workflows/release-prepare
        with:
          branch: next
          semver_type: prerelease
          gpg_private_key: ${{ secrets.TWIN_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.TWIN_GPG_KEY_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Announce release PR
        if: ${{ steps.release-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate 1 – Release PR::Review and merge to publish: ${{ steps.release-prepare.outputs.pr_url }}"

  # ──────────────────────────────────────────────────────────────────────────
  # GATE 1 – WAIT FOR RELEASE PR
  # Polls until the release PR is approved and merged into next.
  # ──────────────────────────────────────────────────────────────────────────
  gate-release-pr:
    name: 'Gate 1 · Merge release PR'
    needs: prepare
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until release PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}
          pr_url: ${{ needs.prepare.outputs.pr_url }}
          waiting_message: Waiting for release PR #__PR_NUMBER__ to be approved and merged...
          success_message: Release PR #__PR_NUMBER__ merged. Proceeding to publish.
          closed_error_title: Gate 1 Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging.
          github_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 2 – PUBLISH
  # Runs once the release PR is merged.
  # ──────────────────────────────────────────────────────────────────────────
  process-workspaces:
    name: Process Workspaces
    needs: gate-release-pr
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.read-workspaces.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Extract workspaces from package.json
        id: read-workspaces
        run: |
          PACKAGES=$(node -e '
            const pkg = JSON.parse(require("fs").readFileSync("./package.json", "utf8"));
            console.log(JSON.stringify(pkg.workspaces));
          ')
          echo "Found packages: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  publish-packages:
    name: Publish Package (${{ matrix.package }})
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
      id-token: write
    needs: process-workspaces
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.process-workspaces.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next

      - name: Load Test Environment Variables
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.TWIN_TEST_ENV_VARS }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          package: ${{ matrix.package }}
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}

      - name: Remove Mono-Repo Node Modules
        run: |
          rm package.json
          rm package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          for i in {1..3}; do
            npm install && break || {
              if [ $i -eq 3 ]; then
                echo "npm install failed after 3 attempts"
                exit 1
              fi
              echo "npm install failed, retrying in 30 seconds (attempt $i/3)..."
              sleep 30
            }
          done

      - name: Run Dist
        run: |
          cd ${{ matrix.package }}
          npm run dist

      - name: Cleanup package.json properties
        run: |
          cd ${{ matrix.package }}
          npm pkg delete scripts
          npm pkg delete devDependencies

      - name: Pack NPM Package
        id: pack_npm_package
        run: |
          cd ${{ matrix.package }}
          TARBALL_FILENAME=$(npm pack --json | node -e 'const input = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(input[0].filename);')
          echo "tarball_filename=${TARBALL_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish NPM Package
        id: publish_npm_package
        run: |
          cd ${{ matrix.package }}
          IS_PRIVATE=$(node -e "console.log(require('./package.json').private === true ? 'true' : 'false')")
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Package is marked as private, skipping publication"
            echo "published=false" >> $GITHUB_OUTPUT
          else
            npm publish "${{ steps.pack_npm_package.outputs.tarball_filename }}" --access public --tag next
            echo "published=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TWIN_NPM_TOKEN }}

      - name: Wait for package to be available on npm
        if: steps.publish_npm_package.outputs.published == 'true'
        run: |
          PACKAGE_NAME='${{ steps.publish_npm_package.outputs.package_name }}'
          PACKAGE_VERSION='${{ steps.publish_npm_package.outputs.package_version }}'

          echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to become available on npm..."

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=10

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is now available on npm."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to appear on npm."
              exit 0
            fi

            echo "Not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

      - name: Teardown Test Environment
        if: always()
        shell: bash
        run: |
          echo "No Docker test resources are created by setup-test-env in this repository."
          rm -f /tmp/test_env_vars.txt

  publish-gh-releases:
    name: Publish GitHub Releases
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
    needs: [process-workspaces, publish-packages]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Release Please
        run: |
          npx --yes release-please github-release \
            --config-file=release/release-please-config.prerelease.json \
            --manifest-file=release/release-please-manifest.prerelease.json \
            --repo-url=${{ github.repository }} \
            --target-branch=next \
            --token=${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  notify-workspace:
    name: Notify Workspace
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    needs: [process-workspaces, publish-gh-releases]

    steps:
      - name: Dispatch submodule change to workspace
        env:
          GH_TOKEN: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
        run: |
          gh api repos/iotaledger/twin-workspace/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "submodule-published",
            "client_payload": {
              "submodule": "${{ github.event.repository.name }}",
              "branch": "next",
              "sha": "${{ github.sha }}"
            }
          }
          EOF
