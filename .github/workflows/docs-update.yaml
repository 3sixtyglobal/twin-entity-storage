# Regenerates documentation on demand by running build+docs, then opens, approves,
# and auto-merges a signed pull request back into the triggering branch (or reports only in dry-run mode).
name: Docs Update

# GHA_RELEASE_TOKEN requires
# contents: read/write
# pull requests: read/write
# workflows: read/write

on:
  # Manual-only workflow for controlled docs refreshes.
  # Tip: run with dryRun=true first to inspect changes before opening a PR.
  workflow_dispatch:
    inputs:
      dryRun:
        # When true, docs are generated and diffs are printed, but no commit is created.
        description: 'Run docs generation and report changes without committing'
        required: true
        default: false
        type: boolean

# Prevent multiple docs jobs from racing on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed to create branch commits and open/modify pull requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      # Checkout the branch that triggered the workflow dispatch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}

      # Use the same Node runtime as other CI workflows in this repo.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Import GPG key for signed commits.
      - name: Import GPG key
        if: ${{ !inputs.dryRun }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --import
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      # Configure git identity and enforce signed commits.
      - name: Configure Git
        if: ${{ !inputs.dryRun }}
        run: |
          git config --global user.email "github@twindev.org"
          git config --global user.name "TWIN GitHub Bot"
          git config --global user.signingkey "$GPG_KEY_ID"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true

      # Install dependencies once at repo root for workspace docs generation.
      - name: Install dependencies
        run: |
          for i in {1..3}; do
            npm ci && break || {
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying in 30 seconds (attempt $i/3)..."
              sleep 30
            }
          done

      # Loop workspaces in package.json order; run build before docs for each.
      - name: Generate package docs
        run: |
          npm run build
          npm run docs

      # Create one repo-wide commit and push only when docs changed.
      - name: Report docs change status
        id: report-docs
        run: |
          if git diff --quiet -- ':(glob)**/docs/**'; then
            echo "No documentation changes were generated."
            echo "docs_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Documentation changes detected in docs folders."
          git status --short -- ':(glob)**/docs/**'
          git diff --name-only -- ':(glob)**/docs/**'
          echo "docs_changed=true" >> $GITHUB_OUTPUT

      # Commit/push is disabled during dry-run mode.
      - name: Commit and push docs update
        if: ${{ !inputs.dryRun && steps.report-docs.outputs.docs_changed == 'true' }}
        run: |
          BRANCH_NAME="chore/docs-update-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # Stage docs folders only so no non-doc changes are committed.
          git add -- ':(glob)**/docs/**'

          # Signed docs commit on a dedicated branch.
          git commit -S -m "docs: regenerate package documentation" --signoff
          git push origin "$BRANCH_NAME"

      - name: Create docs update PR
        id: create-pr
        if: ${{ !inputs.dryRun && steps.report-docs.outputs.docs_changed == 'true' }}
        run: |
          # Open PR back to the branch this workflow was triggered from.
          PR_URL=$(gh pr create \
            --title "docs: regenerate package documentation" \
            --body "Automated docs update generated by Docs Update workflow." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME")

          # Capture PR number for approval and auto-merge steps.
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          # Use workflow token for PR creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Approval uses a separate token because authors generally cannot self-approve.
      - name: Approve docs update PR
        if: ${{ !inputs.dryRun && steps.create-pr.outputs.pr_number != '' }}
        run: |
          gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
        env:
          GH_TOKEN: ${{ secrets.GHA_RELEASE_TOKEN }}

      # Auto-merge queues merge once required checks/rules are satisfied.
      - name: Enable auto-merge for docs update PR
        if: ${{ !inputs.dryRun && steps.create-pr.outputs.pr_number != '' }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GHA_RELEASE_TOKEN }}

      # Block until the PR is actually merged so callers can safely continue.
      - name: Wait for docs update PR merge
        if: ${{ !inputs.dryRun && steps.create-pr.outputs.pr_number != '' }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

          for i in {1..60}; do
            PR_STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state --jq '.state')
            PR_MERGED_AT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergedAt --jq '.mergedAt')

            if [ "$PR_MERGED_AT" != "null" ] && [ -n "$PR_MERGED_AT" ]; then
              echo "Docs update PR #$PR_NUMBER merged at $PR_MERGED_AT."
              exit 0
            fi

            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "Docs update PR #$PR_NUMBER was closed without merge."
              exit 1
            fi

            echo "Docs update PR #$PR_NUMBER not merged yet (attempt $i/60), retrying in 10s..."
            sleep 10
          done

          echo "Timed out waiting for docs update PR #$PR_NUMBER to merge."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GHA_RELEASE_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dryRun }}
        run: |
          echo "Dry run enabled: no commit or push performed."

      # Cleanup: remove imported GPG key material from runner.
      - name: Cleanup GPG key
        if: ${{ always() && !inputs.dryRun }}
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "$GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
            gpg --batch --yes --delete-keys "$FINGERPRINT" || true
          fi
