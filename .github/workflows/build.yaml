name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - next
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  push:
    branches:
      - next
    paths-ignore:
      - '**/*.md'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dist-all-packages:
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'Merge pull request') && github.event.head_commit.message != 'chore: release next') }}"
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}

    steps:
      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6

      # Load test environment variables into the runner environment
      - name: Load Test Environment Variables
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.TWIN_TEST_ENV_VARS }}" >> "$GITHUB_ENV"

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install dependencies with retry
      - name: Install dependencies
        run: |
          for i in {1..3}; do
            npm ci && break || {
              if [ $i -eq 3 ]; then
                echo "npm ci failed after 3 attempts"
                exit 1
              fi
              echo "npm ci failed, retrying in 30 seconds (attempt $i/3)..."
              sleep 30
            }
          done

      # Setup any services required for tests here
      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}

      # Run Lint and Dist
      - name: Run Lint and Dist
        run: |
          npm run lint
          npm run dist
          npm run docs

      # Always teardown the environment, necessary to cleanup self-hosted
      - name: Teardown Test Environment
        if: always()
        uses: ./.github/workflows/teardown-test-env
