name: Release Production

# GHA_RELEASE_TOKEN requires:
#   actions:       read/write
#   contents:      read
#   pull-requests: read

# This workflow orchestrates the full production release process in a single run.
# It drives the Versions Prepare → Release → Publish chain and pauses at each
# review boundary until the generated pull request is approved and merged.
#
# Flow:
#   Phase 1 – Run the versions-prepare composite action for main and create the alignment PR.
#   Gate  1 – Poll until the main alignment PR is approved and merged.
#   Phase 2 – Run the release-prepare composite action for main and wait for the release PR.
#   Gate  2 – Poll until the release PR is approved and merged.
#             Publishing and next-branch realignment proceed automatically via
#             the Release workflow once the release PR is merged.
#
# Event-driven note: The gate jobs poll the GitHub API every 60 seconds for up
# to 6 hours each. For repositories where holding a runner for that duration is
# unacceptable, replace each gate job with a lightweight repository_dispatch
# handler fired from a pull_request.closed event workflow.

on:
  workflow_dispatch:
    inputs:
      semverBump:
        description: 'Version bump type for this production release (ignored when customVersion is set)'
        required: true
        type: choice
        options:
          - '⬆️ promote next'
          - '🔧 patch'
          - '✨ minor'
          - '🚀 major'
      customVersion:
        description: 'Explicit version to release, e.g. 1.2.3. When set, overrides semverBump.'
        required: false
        type: string
        default: ''

  pull_request:
    types: [closed]
    branches:
      - main

# Only one production release may run at a time. A second trigger is queued,
# not cancelled, so it cannot race with an in-progress release.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # GUARD – VALIDATE CUSTOM VERSION
  # When customVersion is provided, validates it against the current production
  # and prerelease manifests before any PRs are created. Checks:
  #   • X.Y.Z format with each component ≤ 999
  #   • Strictly greater than the current published production version
  #   • At least equal to the current development (prerelease) version stripped
  #   • Major version does not jump by more than 1 from current prod
  # ──────────────────────────────────────────────────────────────────────────
  validate-custom-version:
    name: 'Guard · Validate custom version'
    if: github.event_name == 'workflow_dispatch' && inputs.customVersion != ''
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate custom version against current manifests
        run: node scripts/validate-custom-version.mjs prod "${{ inputs.customVersion }}"

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 0 – MERGE NEXT INTO MAIN
  # Creates a branch from main and applies the exact diff of main → next as a
  # single signed commit. Using diff|apply rather than a merge algorithm
  # guarantees next's full content is present (no merge conflicts, no missing
  # files) and avoids pushing unsigned developer commits from next (which would
  # fail a "Commits must have verified signatures" push ruleset). A human merges
  # the PR; GitHub creates and signs the merge commit on main. Skipped when the
  # branches are already in sync.
  # ──────────────────────────────────────────────────────────────────────────
  merge-next-to-main:
    name: 'Phase 0 · Merge next into main'
    needs: [validate-custom-version]
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.validate-custom-version.result == 'success' || needs.validate-custom-version.result == 'skipped')
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      has_changes: ${{ steps.check-diff.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Check if next is ahead of main
        id: check-diff
        run: |
          git fetch --no-tags origin main next
          AHEAD=$(git log origin/main..origin/next --oneline | wc -l)
          if [ "$AHEAD" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "next is $AHEAD commit(s) ahead of main — merge branch required."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "next and main are already in sync — skipping."
          fi

      - name: Import GPG key
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          echo "${{ secrets.TWIN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          echo "TWIN_GPG_KEY_ID=${{ secrets.TWIN_GPG_KEY_ID }}" >> "$GITHUB_ENV"

      - name: Configure Git
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          git config --global user.email "github@twindev.org"
          git config --global user.name "TWIN GitHub Bot"
          git config --global user.signingkey "$TWIN_GPG_KEY_ID"
          git config --global commit.gpgsign true

      - name: Create merge branch
        id: create-branch
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          BRANCH_NAME="release/merge-next-to-main-$(date +%s)"
          git checkout -b "$BRANCH_NAME" origin/main

          # Apply the exact diff from main → next as a single signed commit.
          # Using diff | apply bypasses the merge algorithm entirely — no
          # conflicts to resolve and no unsigned next commits in the push.
          # Correctly handles all cases: adds, modifies, deletes, and renames.
          git diff --binary origin/main origin/next | git apply --index

          git commit -S -m "chore: merge next into main for production release"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create PR merge branch → main
        id: create-pr
        if: ${{ steps.create-branch.outputs.branch_name != '' }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: merge next into main for production release" \
            --body "Automated merge of \`next\` into \`main\`. Conflicts resolved by taking \`next\` content." \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }})
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate 0 – Next to Main PR::Approve and merge to continue the production release: $PR_URL"
          echo "Created PR #$PR_NUMBER: $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: ${{ steps.create-pr.outputs.pr_number != '' }}
        run: |
          gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
        env:
          GH_TOKEN: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Cleanup GPG key
        if: always()
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "$TWIN_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
            gpg --batch --yes --delete-keys "$FINGERPRINT" || true
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # GATE 0 – WAIT FOR NEXT → MAIN PR
  # Polls until the PR is merged. Skipped when branches are already in sync.
  # ──────────────────────────────────────────────────────────────────────────
  gate-next-to-main:
    name: 'Gate 0 · Merge next into main PR'
    needs: merge-next-to-main
    if: |
      always() &&
      !cancelled() &&
      needs.merge-next-to-main.result == 'success' &&
      needs.merge-next-to-main.outputs.has_changes == 'true'
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until next → main PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.merge-next-to-main.outputs.pr_number }}
          pr_url: ${{ needs.merge-next-to-main.outputs.pr_url }}
          waiting_message: Waiting for PR #__PR_NUMBER__ to be merged...
          success_message: PR #__PR_NUMBER__ merged. Advancing to version preparation.
          closed_error_title: Gate 0 Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Production release aborted.
          github_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 1 – PREPARE MAIN
  # Runs the Versions Prepare steps inline on main and creates the alignment
  # PR.
  # ──────────────────────────────────────────────────────────────────────────
  prepare-main:
    name: 'Phase 1 · Prepare and build main branch'
    needs: [merge-next-to-main, gate-next-to-main]
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.merge-next-to-main.result == 'success' || needs.merge-next-to-main.result == 'skipped') &&
      (needs.gate-next-to-main.result == 'success' || needs.gate-next-to-main.result == 'skipped')
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.versions-prepare.outputs.pr_number }}
      pr_url: ${{ steps.versions-prepare.outputs.pr_url }}
      has_changes: ${{ steps.versions-prepare.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Resolve semver type
        id: resolve-semver
        run: |
          CUSTOM="${{ inputs.customVersion }}"
          if [ -n "$CUSTOM" ]; then
            if ! echo "$CUSTOM" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::customVersion must be a valid semver string, e.g. 1.2.3 (got: $CUSTOM)"
              exit 1
            fi
            SEMVER_TYPE='custom'
          else
            INPUT="${{ inputs.semverBump }}"
            case "$INPUT" in
              *promote*) SEMVER_TYPE='promote' ;;
              *patch*) SEMVER_TYPE='patch' ;;
              *minor*) SEMVER_TYPE='minor' ;;
              *major*) SEMVER_TYPE='major' ;;
              *)
                echo "::error::Unrecognised semver bump: $INPUT"
                exit 1
                ;;
            esac
          fi
          echo "semver_type=$SEMVER_TYPE" >> $GITHUB_OUTPUT

      - name: Versions Prepare
        id: versions-prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: main
          semver_type: ${{ steps.resolve-semver.outputs.semver_type }}
          custom_version: ${{ inputs.customVersion }}
          gpg_private_key: ${{ secrets.TWIN_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.TWIN_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Announce main alignment PR
        if: ${{ steps.versions-prepare.outputs.has_changes == 'true' && steps.versions-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate 1 – Main Alignment PR::Approve and merge to continue the production release: ${{ steps.versions-prepare.outputs.pr_url }}"

      # Our self-hosted runner clears the workspace after local composite
      # actions, so restore the workflow ref before the job completes.
      - name: Restore workflow checkout
        if: ${{ always() }}
        uses: actions/checkout@v6

  # ──────────────────────────────────────────────────────────────────────────
  # GATE 1 – WAIT FOR MAIN ALIGNMENT PR
  # Polls until the PR is merged. Fails hard if the PR is closed without merge
  # so the release does not proceed on a misaligned main branch.
  # ──────────────────────────────────────────────────────────────────────────
  gate-main-alignment:
    name: 'Gate 1 · Merge main alignment PR'
    needs: prepare-main
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-main.result == 'success' &&
      needs.prepare-main.outputs.has_changes == 'true'
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until main alignment PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare-main.outputs.pr_number }}
          pr_url: ${{ needs.prepare-main.outputs.pr_url }}
          waiting_message: Waiting for PR #__PR_NUMBER__ to be approved and merged...
          success_message: PR #__PR_NUMBER__ merged. Advancing to release preparation.
          closed_error_title: Gate 1 Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Production release aborted.
          closed_follow_up: Re-run this workflow to restart.
          github_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 2 – PREPARE RELEASE PR
  # Maps the semver input to the target branch and semver strategy, then runs
  # the release-prepare composite directly to create the release PR. Runs
  # whether Phase 1 produced a PR or was a no-op.
  # ──────────────────────────────────────────────────────────────────────────
  prepare-release:
    name: 'Phase 2 · Prepare release PR'
    needs: gate-main-alignment
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.gate-main-alignment.result == 'success' || needs.gate-main-alignment.result == 'skipped')
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 60
    permissions:
      checks: read
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.release-prepare.outputs.pr_number }}
      pr_url: ${{ steps.release-prepare.outputs.pr_url }}

    steps:
      - name: Resolve release type
        id: resolve-release
        run: |
          CUSTOM="${{ inputs.customVersion }}"
          if [ -n "$CUSTOM" ]; then
            # Release-As in the force commit overrides versioning strategy,
            # so semver_type only needs to be a valid value here.
            BRANCH='main'; SEMVER_TYPE='patch'
          else
            INPUT="${{ inputs.semverBump }}"
            case "$INPUT" in
              *promote*) BRANCH='main'; SEMVER_TYPE='patch' ;;
              *patch*) BRANCH='main'; SEMVER_TYPE='patch' ;;
              *minor*) BRANCH='main'; SEMVER_TYPE='minor' ;;
              *major*) BRANCH='main'; SEMVER_TYPE='major' ;;
              *)
                echo "::error::Unrecognised semver bump: $INPUT"
                exit 1
                ;;
            esac
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "semver_type=$SEMVER_TYPE" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"
          echo "Using semver type: $SEMVER_TYPE"

      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Prepare release PR
        id: release-prepare
        uses: ./.github/workflows/release-prepare
        with:
          branch: ${{ steps.resolve-release.outputs.branch }}
          semver_type: ${{ steps.resolve-release.outputs.semver_type }}
          gpg_private_key: ${{ secrets.TWIN_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.TWIN_GPG_KEY_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Announce release PR
        if: ${{ steps.release-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate 2 – Release PR::Review and merge to publish: ${{ steps.release-prepare.outputs.pr_url }}"

  # ──────────────────────────────────────────────────────────────────────────
  # GATE 2 – WAIT FOR RELEASE PR
  # Polls until the release PR (labelled autorelease: pending) is merged.
  # Once merged, the Release workflow's publish phase fires automatically
  # and the next branch is realigned after publishing completes.
  # ──────────────────────────────────────────────────────────────────────────
  gate-release-pr:
    name: 'Gate 2 · Merge release PR'
    needs: prepare-release
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.pr_number != ''
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until release PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare-release.outputs.pr_number }}
          pr_url: ${{ needs.prepare-release.outputs.pr_url }}
          waiting_message: |
            Waiting for release PR #__PR_NUMBER__ to be approved and merged...
            Once merged, packages will publish automatically and next will be realigned.
          success_message: |
            Release PR #__PR_NUMBER__ merged.
            The Release workflow is now publishing packages to npm and creating GitHub releases.
            The next branch will be realigned automatically after publishing completes.
          closed_error_title: Gate 2 Failed
          closed_error_message: Release PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Publishing aborted.
          closed_follow_up: "To recover: remove the 'autorelease: pending' label from the PR, then re-run this workflow."
          github_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # SUMMARY
  # Prints the final handoff state once both gates have passed.
  # Publishing and next-branch realignment are already underway via the
  # Release workflow at this point.
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: 'Production release handoff complete'
    needs: [merge-next-to-main, prepare-main, prepare-release, gate-release-pr]
    if: github.event_name == 'workflow_dispatch' && always() && !cancelled() && needs.gate-release-pr.result == 'success'
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      actions: read

    steps:
      - name: Print release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait for the publish run (triggered by the PR merge) to register
          PUBLISH_RUN_URL=""
          for i in 1 2 3 4 5 6; do
            PUBLISH_RUN_URL=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/release-production.yaml/runs?event=pull_request&per_page=5" \
              --jq "[.workflow_runs[] | select(.run_number > ${{ github.run_number }})][0].html_url // empty")
            [ -n "$PUBLISH_RUN_URL" ] && break
            sleep 5
          done
          PUBLISH_RUN_URL="${PUBLISH_RUN_URL:-https://github.com/${{ github.repository }}/actions/workflows/release-production.yaml}"

          echo "## Production Release Orchestration Complete"
          echo ""
          if [ "${{ needs.merge-next-to-main.outputs.has_changes }}" = "true" ]; then
            echo "Next → main PR:     ${{ needs.merge-next-to-main.outputs.pr_url }}"
          else
            echo "Next → main PR:     skipped (branches already in sync)"
          fi
          if [ "${{ needs.prepare-main.outputs.has_changes }}" = "true" ]; then
            echo "Main alignment PR:  ${{ needs.prepare-main.outputs.pr_url }}"
          else
            echo "Main alignment PR:  skipped (no version changes)"
          fi
          echo "Release PR:         ${{ needs.prepare-release.outputs.pr_url }}"
          echo ""
          echo "The Release workflow is now:"
          echo "  • Publishing packages to npm (latest tag)"
          echo "  • Creating GitHub releases"
          echo "  • Realigning the next branch (auto-merge enabled; merges when checks pass)"
          echo ""
          echo "Publish run: $PUBLISH_RUN_URL"
          echo "::notice title=Publish Run::$PUBLISH_RUN_URL"

          {
            echo "## Production Release Orchestration Complete"
            echo ""
            if [ "${{ needs.merge-next-to-main.outputs.has_changes }}" = "true" ]; then
              echo "- **Next → main PR:** ${{ needs.merge-next-to-main.outputs.pr_url }}"
            else
              echo "- **Next → main PR:** skipped (branches already in sync)"
            fi
            if [ "${{ needs.prepare-main.outputs.has_changes }}" = "true" ]; then
              echo "- **Main alignment PR:** ${{ needs.prepare-main.outputs.pr_url }}"
            else
              echo "- **Main alignment PR:** skipped (no version changes)"
            fi
            echo "- **Release PR:** ${{ needs.prepare-release.outputs.pr_url }}"
            echo ""
            echo "The publish workflow is now running — packages are being published to npm, GitHub releases are being created, and the next branch is being realigned."
            echo ""
            echo ":rocket: **[View publish run]($PUBLISH_RUN_URL)**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 3 – PUBLISH
  # Triggered automatically when the release PR (autorelease: pending) merges
  # into main. Publishes packages to npm and creates GitHub releases.
  # ──────────────────────────────────────────────────────────────────────────

  process-workspaces:
    name: Process Workspaces
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.read-workspaces.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Extract workspaces from package.json
        id: read-workspaces
        run: |
          PACKAGES=$(node -e '
            const pkg = JSON.parse(require("fs").readFileSync("./package.json", "utf8"));
            console.log(JSON.stringify(pkg.workspaces));
          ')
          echo "Found packages: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  publish-packages:
    name: Publish Package (${{ matrix.package || 'phase 3 only' }})
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
      id-token: write
    needs: process-workspaces
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.process-workspaces.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main

      - name: Load Test Environment Variables
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.TWIN_TEST_ENV_VARS }}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          package: ${{ matrix.package }}
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}

      - name: Remove Mono-Repo Node Modules
        run: |
          rm package.json
          rm package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          for i in {1..5}; do
            npm install && break || {
              if [ $i -eq 5 ]; then
                echo "npm install failed after 5 attempts"
                exit 1
              fi
              echo "npm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      - name: Run Dist
        run: |
          cd ${{ matrix.package }}
          npm run dist

      - name: Cleanup package.json properties
        run: |
          cd ${{ matrix.package }}
          npm pkg delete scripts
          npm pkg delete devDependencies

      - name: Pack NPM Package
        id: pack_npm_package
        run: |
          cd ${{ matrix.package }}
          TARBALL_FILENAME=$(npm pack --json | node -e 'const input = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(input[0].filename);')
          echo "tarball_filename=${TARBALL_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish NPM Package
        id: publish_npm_package
        run: |
          cd ${{ matrix.package }}
          IS_PRIVATE=$(node -e "console.log(require('./package.json').private === true ? 'true' : 'false')")
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Package is marked as private, skipping publication"
            echo "published=false" >> $GITHUB_OUTPUT
          else
            npm publish "${{ steps.pack_npm_package.outputs.tarball_filename }}" --access public --tag latest
            echo "published=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TWIN_NPM_TOKEN }}

      - name: Wait for package to be available on npm
        if: steps.publish_npm_package.outputs.published == 'true'
        run: |
          PACKAGE_NAME='${{ steps.publish_npm_package.outputs.package_name }}'
          PACKAGE_VERSION='${{ steps.publish_npm_package.outputs.package_version }}'

          echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to become available on npm..."

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=10

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is now available on npm."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to appear on npm."
              exit 0
            fi

            echo "Not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

      - name: Teardown Test Environment
        if: always()
        uses: ./.github/workflows/teardown-test-env

  publish-gh-releases:
    name: Publish GitHub Releases
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    permissions:
      contents: read
    needs: [process-workspaces, publish-packages]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Release Please
        run: |
          npx --yes release-please github-release \
            --config-file=release/release-please-config.prod.json \
            --manifest-file=release/release-please-manifest.prod.json \
            --repo-url=${{ github.repository }} \
            --target-branch=main \
            --token=${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  notify-workspace:
    name: Notify Workspace
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    needs: [process-workspaces, publish-gh-releases]

    steps:
      - name: Dispatch submodule change to workspace
        env:
          GH_TOKEN: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
        run: |
          gh api repos/iotaledger/twin-workspace/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "submodule-published",
            "client_payload": {
              "submodule": "${{ github.event.repository.name }}",
              "branch": "main",
              "sha": "${{ github.sha }}"
            }
          }
          EOF

  # Trigger next-branch realignment after production publish so development
  # can resume from the released version.
  realign-next:
    name: Realign Next Branch
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    needs: [process-workspaces, notify-workspace]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.versions-prepare.outputs.pr_number }}
      pr_url: ${{ steps.versions-prepare.outputs.pr_url }}
      has_changes: ${{ steps.versions-prepare.outputs.has_changes }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Versions Prepare for next
        id: versions-prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: next
          gpg_private_key: ${{ secrets.TWIN_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.TWIN_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.TWIN_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Enable auto-merge on next alignment PR
        if: ${{ steps.versions-prepare.outputs.pr_number != '' }}
        run: |
          gh pr merge ${{ steps.versions-prepare.outputs.pr_number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # GATE 3 – WAIT FOR NEXT ALIGNMENT PR
  # Polls until the realignment PR for the next branch is merged. The PR is
  # pre-approved and auto-merge is enabled, so it merges as soon as all
  # required status checks pass. Skipped when versions-prepare was a no-op.
  # ──────────────────────────────────────────────────────────────────────────
  gate-realign-next:
    name: 'Gate 3 · Merge next alignment PR'
    needs: realign-next
    if: ${{ needs.realign-next.outputs.has_changes == 'true' }}
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until next alignment PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.realign-next.outputs.pr_number }}
          pr_url: ${{ needs.realign-next.outputs.pr_url }}
          waiting_message: Waiting for next alignment PR #__PR_NUMBER__ to merge (auto-merge enabled)...
          success_message: Next alignment PR #__PR_NUMBER__ merged. Next branch is realigned to the released version.
          closed_error_title: Gate 3 Failed
          closed_error_message: Next alignment PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Next branch realignment incomplete.
          closed_follow_up: Re-run the Realign Next Branch job or manually merge the next alignment PR.
          github_token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}

      - name: Workflow complete
        run: echo "::notice title=Workflow Complete::Production release finished. Packages published to npm, GitHub releases created, and next branch realigned."
